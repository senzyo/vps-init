flush ruleset

table inet firewall {
    # 定义 IPv4 动态限速集合
    set limit_icmp_v4 {
        type ipv4_addr
        flags dynamic
        timeout 1m
    }

    # 定义 IPv6 动态限速集合
    set limit_icmp_v6 {
        type ipv6_addr
        flags dynamic
        timeout 1m
    }

    chain input {
        type filter hook input priority 0; policy drop;

        # 允许回环接口
        iif lo accept

        # 状态检查
        ct state invalid drop
        ct state { established, related } accept

        # 反欺骗检查
        fib saddr . iif oif missing drop

        # 允许特定 TCP/UDP 端口
        tcp dport { 80, 443, 40022 } accept
        udp dport 443 accept
        udp dport 33434-33534 accept

        # ICMP 处理
        meta protocol vmap { ip : jump input_ipv4, ip6 : jump input_ipv6 }
    }

    chain input_ipv4 {
        # ICMP 限速：每个 IP 允许 20次/秒，突发允许 50 个包
        icmp type echo-request add @limit_icmp_v4 { ip saddr limit rate 20/second burst 50 packets } accept

        # 错误类 ICMP 限速：总速率 100次/秒，突发 100 个包
        icmp type { destination-unreachable, time-exceeded, parameter-problem } limit rate 100/second burst 100 packets accept
    }

    chain input_ipv6 {
        # ICMP 限速：每个 IPv6 允许 20次/秒，突发允许 50 个包
        icmpv6 type echo-request add @limit_icmp_v6 { ip6 saddr limit rate 20/second burst 50 packets } accept

        # 错误类 ICMP 限速：总速率 100次/秒，突发 100 个包
        icmpv6 type { packet-too-big, destination-unreachable, time-exceeded, parameter-problem } limit rate 100/second burst 100 packets accept

        # 允许 IPv6 邻居发现
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}